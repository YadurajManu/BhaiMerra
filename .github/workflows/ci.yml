name: CI

# The README has carried a build badge since the beginning and there was no
# workflow behind it, so it rendered "unknown" to every visitor. This runs the
# tests that already exist rather than inventing new ones.

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleetos_test
        ports: ['5432:5432']
        # Without this the first migration races the database's own startup.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fleetos_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-real
      # 32 bytes, base64. Test-only; a real one is generated per install.
      SECRETS_MASTER_KEY: ZmxlZXQtb3MtdGVzdC1tYXN0ZXIta2V5LTMyYnl0ZXM=
      LOG_LEVEL: error
      BUILD_WORKDIR: /tmp/fleet-os-ci-builds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci
        working-directory: control-plane
      - run: npm run typecheck
        working-directory: control-plane
      - name: migrate
        run: npx tsx src/db/migrate.ts
        working-directory: control-plane
      # The package script loads .env.test, which is gitignored and absent
      # here; the environment above supplies the same values.
      - name: test
        run: node --test --test-concurrency=1 --import tsx tests/*.test.ts
        working-directory: control-plane

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - run: npx tsc --noEmit
        working-directory: cli
      - run: npm test
        working-directory: cli

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npx tsc --noEmit
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: agent/go.sum
      - run: go vet ./...
        working-directory: agent
      - run: go test ./...
        working-directory: agent
      # The agent ships for Windows too, and that path only compiles behind a
      # build tag — so it is the one most likely to break unnoticed.
      - name: cross-compile every target
        working-directory: agent
        run: |
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/agent
            echo "built $target"
          done
