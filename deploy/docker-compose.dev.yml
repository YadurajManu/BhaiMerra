# Local development dependencies for the control plane.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# Postgres and Redis are commented out by default because a Homebrew install
# of either is common and would fight these for the port. Uncomment whichever
# you are not already running.

services:
  registry:
    image: registry:2
    container_name: fleet-registry
    restart: unless-stopped
    ports:
      - '5001:5000'
    volumes:
      - registry-data:/var/lib/registry

  # postgres:
  #   image: postgres:16
  #   container_name: fleet-postgres
