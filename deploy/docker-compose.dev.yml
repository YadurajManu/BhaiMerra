  #     - pg-data:/var/lib/postgresql/data

  # redis:
  #   image: redis:7-alpine
  #   container_name: fleet-redis
  #   restart: unless-stopped
  #   ports:
  #     - '6379:6379'

volumes:
  registry-data:
