# The whole Fleet OS control plane in one command.
#
#   cd deploy
#   cp .env.example .env      # then fill in the two generated secrets
#   docker compose up -d
#
# What this gives you: Postgres, Redis, a container registry, and the control
# plane itself, with the API on :8080 and the public ingress edge on :8081.
#
# What it does NOT give you: the agent. That runs on the machines you want to
# deploy to, which is the whole point — install it with scripts/install.sh.

name: fleet-os

services:
  postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetos}
      POSTGRES_USER: ${POSTGRES_USER:-fleetos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published by default: nothing outside this network needs it, and an
    # exposed database is how homelabs end up in a breach report.
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fleetos}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fleet-redis
    restart: unless-stopped
    # Heartbeats are the only thing in here and they are all TTL'd, so losing
    # Redis on restart costs one detection cycle, not data.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  registry:
    image: registry:2
    container_name: fleet-registry
    restart: unless-stopped
    environment:
      # Authentication, because a registry reachable from outside the LAN is
      # otherwise readable *and writable* by anyone who finds the address —
      # registry:2 has no access control of its own. The htpasswd file is
      # generated at setup and is not in the repository.
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: 'Fleet OS registry'
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    ports:
      # Published because the agents on your other machines pull from it.
      - '${REGISTRY_PORT:-5001}:5000'
    volumes:
      - registrydata:/var/lib/registry
      - ./registry-auth:/auth:ro
    healthcheck:
      # 401 means the registry is up and asking for credentials, which is
      # exactly healthy. A plain `wget -qO-` exits non-zero on it and would
      # report an authenticated registry as broken.
      test:
        - CMD-SHELL
        - 'wget -S -O /dev/null http://127.0.0.1:5000/v2/ 2>&1 | grep -qE "HTTP/1.1 (200|401)"'
      interval: 10s
      timeout: 5s
      retries: 5

  control-plane:
    build:
      context: ../control-plane
    container_name: fleet-control-plane
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      registry: { condition: service_started }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fleetos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fleetos}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:?set SECRETS_MASTER_KEY in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      # From https://github.com/apps/<slug>. Without it the dashboard cannot
      # send anyone into the install flow, which is the only thing that binds
      # a new installation to their organisation.
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      # Where GitHub returns the browser after an install completes.
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-}
      # Agents pull by this address, so it must be what *they* can reach —
      # not "registry", which only resolves inside this compose network.
      REGISTRY_URL: ${REGISTRY_URL:?set REGISTRY_URL to a host:port your agents can reach}
      # "username:password". The control plane signs in before pushing, and
      # hands the same credential to agents in their desired state so they can
      # pull. Leave empty for a registry that needs none.
      REGISTRY_CREDENTIALS: ${REGISTRY_CREDENTIALS:-}
      # Email. Both are optional and only work together: without them alert
      # rules with an email channel log what they would have sent instead of
      # failing, so an unconfigured control plane still runs normally.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Explaining failed deploys. The operator holds one key and pays for the
      # calls; users are bounded by a per-person daily limit rather than being
      # asked to find a provider of their own. Absent means the feature is off.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://agentrouter.org/v1}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-8}
      BUILDX_BUILDER: ${BUILDX_BUILDER:-}
      # "min" when the registry is behind a proxy with a request size limit —
      # Cloudflare's free plan rejects bodies over 100MB, and "max" exports
      # every intermediate build stage.
      BUILDX_CACHE_MODE: ${BUILDX_CACHE_MODE:-max}
      BUILD_WORKDIR: /var/lib/fleet-os/builds
      BACKUP_DIR: /var/lib/fleet-os/backups
      INSTALL_SCRIPT_PATH: /app/install/install.sh
      AGENT_BIN_DIR: /app/install/bin
      # Agents call the root API, which differs from the dashboard's /api
      # browser proxy. Set this whenever the dashboard is publicly exposed.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://fleetapi.${INGRESS_ZONE:-fleetos.app}}
      INGRESS_ZONE: ${INGRESS_ZONE:-fleetos.app}
      INGRESS_PORT: '8081'
      HEARTBEAT_INTERVAL_SEC: ${HEARTBEAT_INTERVAL_SEC:-5}
      HEARTBEAT_MISS_THRESHOLD: ${HEARTBEAT_MISS_THRESHOLD:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${API_PORT:-8080}:8080'      # control-plane API
      - '${INGRESS_PORT:-8081}:8081'  # public edge
    volumes:
      - builds:/var/lib/fleet-os/builds
      # Backups are the one thing here that cannot be regenerated, so they get
      # their own volume rather than sharing scratch space that gets cleaned.
      - backups:/var/lib/fleet-os/backups
      # The installer and the cross-compiled agents, served at /install so a
      # self-hosted control plane needs no CDN behind it.
      - ../scripts/install.sh:/app/install/install.sh:ro
      - ../agent/dist:/app/install/bin:ro
      # Optional GitHub App key. Only mounted when configured; it is never
      # exposed to the dashboard or to an agent.
      - ${GITHUB_APP_PRIVATE_KEY:-/dev/null}:/run/secrets/github-app.pem:ro
      # Multi-arch builds run through the host's Docker rather than a daemon
      # inside this container. This is a privileged mount: anything that can
      # write to it can control the host's Docker. Drop it if you only ever
      # deploy prebuilt images.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dashboard:
    build:
      context: ../dashboard
    container_name: fleet-dashboard
    restart: unless-stopped
    depends_on:
      - control-plane
    ports:
      - '${DASHBOARD_PORT:-8082}:80'
    # nginx serves the SPA and proxies /api to the control plane, so the
    # browser only ever talks to one origin.

  www:
    build:
      context: ../www
      args:
        VITE_APP_URL: ${APP_URL:-http://localhost:8082}
    container_name: fleet-www
    restart: unless-stopped
    ports:
      - '${WWW_PORT:-8083}:80'
    # The marketing site. Static, and the only service here with no state.

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fleet-tunnel
    # Supervised. Run as a bare background process it exits after a few failed
    # reconnects and the site goes down with nothing watching.
    restart: unless-stopped
    depends_on:
      control-plane: { condition: service_healthy }
    command: tunnel --config /etc/cloudflared/config.yml run
    # sshd runs on the host, not in a container, so the ssh ingress rule needs
    # a name that resolves to the host from inside this one.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./cloudflare/fleet-os.yml:/etc/cloudflared/config.yml:ro
      - ${TUNNEL_CREDENTIALS:?set TUNNEL_CREDENTIALS in .env}:/etc/cloudflared/credentials.json:ro
    profiles: ['tunnel']

volumes:
  pgdata:
  registrydata:
  builds:
  backups:
