server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # $uri/index.html before $uri/ on purpose. Without it nginx answers a
  # prerendered directory with a 301 to the trailing-slash form, which gives
  # every documentation page two URLs and makes the canonical point at the one
  # that redirects. Serving the file directly keeps it to one.
  location / { try_files $uri $uri/index.html $uri/ /index.html; }

  # Behind the tunnel nginx does not know the public scheme or host, so any
  # redirect it does emit must stay relative rather than inventing http://.
  absolute_redirect off;

  # A stale sitemap is worse than none: it advertises URLs that may have moved.
  location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
  location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
  location = /healthz { access_log off; return 200 "ok\n"; }

  # Hashed asset filenames, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
