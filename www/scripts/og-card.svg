  <text x="848" y="268" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="13" fill="#5d6672" letter-spacing="0.6">amd64 · always-on</text>
  <text x="1024" y="182" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#939ba7" letter-spacing="0.6">raspberry pi 5</text>
  <text x="1112" y="414" text-anchor="end" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#939ba7" letter-spacing="0.6">vps · burst</text>

