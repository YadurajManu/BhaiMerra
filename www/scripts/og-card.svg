  <circle cx="820" cy="252" r="40" fill="none" stroke="#3fe08b" stroke-opacity="0.30" stroke-width="2"/>
  <circle cx="820" cy="252" r="62" fill="none" stroke="#3fe08b" stroke-opacity="0.13" stroke-width="2"/>
  <circle cx="820" cy="252" r="15" fill="#3fe08b"/>
  <circle cx="1004" cy="186" r="11" fill="#8d99a6"/>
