    <line x1="820" y1="252" x2="778" y2="430"/>
    <line x1="820" y1="252" x2="1004" y2="186"/>
    <line x1="960" y1="330" x2="1004" y2="186"/>
    <line x1="960" y1="330" x2="1112" y2="382"/>
    <line x1="960" y1="330" x2="778" y2="430"/>
    <line x1="1004" y1="186" x2="1112" y2="382"/>
    <line x1="778" y1="430" x2="668" y2="352"/>
    <line x1="820" y1="252" x2="668" y2="352"/>
