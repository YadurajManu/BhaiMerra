<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#08090b" stop-opacity="1"/>
      <stop offset="42%" stop-color="#08090b" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#08090b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fe08b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3fe08b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#08090b"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="880" cy="300" r="260" fill="url(#pool)"/>

  <!-- the fleet: same topology as the site -->
  <g stroke="#4a5763" stroke-opacity="0.42" stroke-width="1.4">
