server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The SPA owns its routes; anything not a real file is index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API. Keeps cookies and CORS out of the picture entirely.
  location /api/ {
    proxy_pass http://control-plane:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Deploys build multi-arch images and can take minutes.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
  }

  location = /healthz { access_log off; return 200 "ok\n"; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
