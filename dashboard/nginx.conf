# Trust the proxy's scheme when it sends one.
#
# TLS terminates at Cloudflare, so nginx only ever sees plain HTTP and
# $scheme is always "http". Passing that on overwrites the real scheme, and
# the control plane then builds https URLs as http — including the pairing
# command it hands users.
map $http_x_forwarded_proto $forwarded_scheme {
  default   $scheme;
  "~^https?$" $http_x_forwarded_proto;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The SPA owns its routes; anything not a real file is index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The installer and agent binaries, proxied from the control plane.
  #
  # Not optional. The dashboard reaches the API through /api below, so the
  # control plane sees this host and generates its pairing command against it.
  # Without this the SPA catch-all answers /install with index.html, and the
  # documented `curl … | sh` pipes HTML into a shell.
  location /install {
    proxy_pass http://control-plane:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Agent binaries are several megabytes; do not buffer them to disk first.
    proxy_buffering off;
  }

  # Same-origin API. Keeps cookies and CORS out of the picture entirely.
  location /api/ {
    proxy_pass http://control-plane:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    # Deploys build multi-arch images and can take minutes.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
  }

  location = /healthz { access_log off; return 200 "ok\n"; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
